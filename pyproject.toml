[project]
name = "megaagent"
version = "0.1.0"
description = "Multi-agent system for large-scale task decomposition without predefined SOPs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.3.4",
    "config>=0.5.1",
    "logging>=0.4.9.6",
    "requests>=2.32.5",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
